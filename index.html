<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molten Forge</title>
    <script>
      (() => {
        const storageKey = "code-forge-theme";
        let preference = "system";

        try {
          const stored = window.localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch {
          // Fall back to the operating-system appearance when storage is unavailable.
        }

        const resolved =
          preference === "system"
            ? window.matchMedia?.("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <style>
      :root {
        --startup-background: oklch(0.955 0.004 95);
        --startup-foreground: oklch(0.5 0.01 95);
      }

      :root.dark {
        --startup-background: #1e1e1e;
        --startup-foreground: #a0a0a0;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--startup-background);
      }

      body {
        overflow: hidden;
      }

      #startup-titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 10;
        display: none;
        height: 40px;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        padding: 4px 4px 4px 0;
        color: var(--startup-foreground);
        -webkit-app-region: drag;
      }

      #startup-titlebar[data-visible="true"] {
        display: flex;
      }

      .startup-window-control {
        width: 32px;
        height: 32px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: inherit;
        cursor: pointer;
        transition:
          background-color 120ms ease,
          color 120ms ease;
        -webkit-app-region: no-drag;
      }

      .startup-window-control:hover {
        background: color-mix(in oklab, currentColor 12%, transparent);
      }

      .startup-window-control:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: -2px;
      }

      .startup-window-control-close:hover {
        background: #dc2626;
        color: #ffffff;
      }

      .startup-window-control svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }

      .startup-window-control svg[hidden] {
        display: none !important;
      }

      #startup-loading-screen {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--startup-background);
        color: var(--startup-foreground);
      }

      @keyframes molten-forge-loading-fade {
        to {
          opacity: 0;
        }
      }

      @keyframes molten-forge-lava-flow {
        0% {
          background-position: 20% 50%;
        }

        25% {
          background-position: 50% 20%;
        }

        50% {
          background-position: 80% 50%;
        }

        75% {
          background-position: 50% 80%;
        }

        100% {
          background-position: 20% 50%;
        }
      }

      #startup-loading-screen .molten-forge-loading-text {
        color: var(--startup-foreground);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        animation: molten-forge-loading-fade 1s linear infinite alternate;
      }

      :root.dark #startup-loading-screen .molten-forge-loading-text {
        background-image: radial-gradient(
          circle,
          #ffcc70 0%,
          #f6a85f 24%,
          #e17349 46%,
          #c84830 72%,
          #c84830 100%
        );
        background-size: 240% 240%;
        background-position: 20% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation:
          molten-forge-lava-flow 15s linear infinite,
          molten-forge-loading-fade 1s linear infinite alternate;
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-loading-screen .molten-forge-loading-text {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-titlebar" aria-label="Window controls">
      <button
        id="startup-minimize-window"
        class="startup-window-control"
        type="button"
        title="Minimize"
        aria-label="Minimize"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        id="startup-toggle-maximize-window"
        class="startup-window-control"
        type="button"
        title="Maximize"
        aria-label="Maximize"
      >
        <svg
          id="startup-maximize-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="5" y="5" width="14" height="14" rx="1" />
        </svg>
        <svg
          id="startup-restore-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <rect x="8" y="4" width="12" height="12" rx="1" />
          <path d="M16 16v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h3" />
        </svg>
      </button>
      <button
        id="startup-close-window"
        class="startup-window-control startup-window-control-close"
        type="button"
        title="Close"
        aria-label="Close"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      </div>
      <main id="startup-loading-screen">
        <div
          class="molten-forge-loading-text"
          aria-label="Loading app data"
        >
          Loading...
        </div>
      </main>
    </div>
    <script>
      (() => {
        const desktop = window.moltenForgeDesktop;
        const titlebar = document.getElementById("startup-titlebar");
        const minimizeButton = document.getElementById(
          "startup-minimize-window",
        );
        const maximizeButton = document.getElementById(
          "startup-toggle-maximize-window",
        );
        const closeButton = document.getElementById("startup-close-window");
        const maximizeIcon = document.getElementById("startup-maximize-icon");
        const restoreIcon = document.getElementById("startup-restore-icon");

        if (
          !desktop?.usesCustomWindowControls ||
          !titlebar ||
          !minimizeButton ||
          !maximizeButton ||
          !closeButton ||
          !maximizeIcon ||
          !restoreIcon
        ) {
          return;
        }

        titlebar.dataset.visible = "true";

        const updateWindowState = (state) => {
          titlebar.dataset.visible = state.fullscreen ? "false" : "true";
          maximizeIcon.hidden = state.maximized;
          restoreIcon.hidden = !state.maximized;
          maximizeButton.title = state.maximized ? "Restore" : "Maximize";
          maximizeButton.setAttribute(
            "aria-label",
            state.maximized ? "Restore" : "Maximize",
          );
        };

        minimizeButton.addEventListener("click", () => {
          void desktop.minimizeWindow();
        });

        maximizeButton.addEventListener("click", () => {
          void desktop
            .toggleMaximizeWindow()
            .then(updateWindowState)
            .catch(() => {});
        });

        closeButton.addEventListener("click", () => {
          void desktop.closeWindow();
        });

        void desktop.getWindowState().then(updateWindowState).catch(() => {});
        const unsubscribe = desktop.onWindowStateChange(updateWindowState);

        const observer = new MutationObserver(() => {
          if (!document.getElementById("startup-loading-screen")) {
            unsubscribe();
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById("root"), { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
